

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ReLeaf</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
    <style>
        :root {
            --primary-green: #2d7a48;
            --primary-light: #4CAF50;
            --accent-mint: #98e2c6;
            --accent-beige: #f5e6d3;
            --gradient-start: #2d7a48;
            --gradient-end: #66bb6a;
            --shadow-color: rgba(46, 82, 61, 0.15);
            --glass-bg: rgba(255, 255, 255, 0.95);
            --glass-border: rgba(255, 255, 255, 0.2);
        }

        body {
            background: linear-gradient(135deg, #2d7a48 0%, #66bb6a 100%);
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 20%, rgba(152, 226, 198, 0.4) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(245, 230, 211, 0.4) 0%, transparent 40%),
                url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30 5C35 5 35 15 40 15C45 15 45 5 50 5C55 5 55 15 60 15V60H0V15C5 15 5 5 10 5C15 5 15 15 20 15C25 15 25 5 30 5Z' fill='rgba(152, 226, 198, 0.1)'/%3E%3C/svg%3E");
            z-index: 0;
            pointer-events: none;
        }

        .login-main {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 2rem;
            z-index: 1;
        }

        .eco-particles {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .eco-particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: float 20s infinite linear;
        }

        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); }
            100% { transform: translateY(-100vh) rotate(360deg); }
        }

        .login-card-modern {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: 
                0 8px 32px var(--shadow-color),
                0 1px 2px rgba(255, 255, 255, 0.1),
                inset 0 1px 2px rgba(255, 255, 255, 0.2);
            padding: 3rem 2.5rem;
            max-width: 420px;
            width: 100%;
            text-align: center;
            position: relative;
            overflow: hidden;
            transition: transform 0.3s ease;
        }

        .login-card-modern::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--gradient-start), var(--gradient-end));
            border-radius: 4px 4px 0 0;
        }

        .login-card-modern:hover {
            transform: translateY(-5px);
        }
            opacity: 0;
            transform: translateY(20px);
            background: #fff;
            border-radius: 24px;
            box-shadow: 0 8px 32px 0 rgba(46, 82, 61, 0.15);
            padding: 3rem 2.5rem;
            max-width: 400px;
            width: 100%;
            text-align: center;
            position: relative;
            z-index: 2;
        }
        .login-logo-modern {
            position: relative;
            margin-bottom: 2rem;
        }

        .login-logo-modern img {
            height: 80px;
            margin-bottom: 1rem;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.1));
            animation: float-gentle 6s ease-in-out infinite;
        }

        @keyframes float-gentle {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .login-title-modern {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary-green), var(--primary-light));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 0.5rem;
            letter-spacing: -0.02em;
        }

        .login-subtitle-modern {
            color: var(--primary-green);
            font-size: 1.1rem;
            margin-bottom: 2rem;
            opacity: 0.8;
        }

        .login-tabs {
            display: flex;
            margin-bottom: 2rem;
            border-radius: 12px;
            background: rgba(152, 226, 198, 0.1);
            padding: 4px;
            position: relative;
            border: 1px solid rgba(152, 226, 198, 0.2);
        }

        .login-tab {
            flex: 1;
            padding: 0.75rem;
            color: var(--primary-green);
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 8px;
            font-weight: 500;
            position: relative;
            overflow: hidden;
        }

        .login-tab::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 1;
        }

        .login-tab span {
            position: relative;
            z-index: 2;
        }

        .login-tab:hover::before {
            opacity: 0.1;
        }

        .login-tab.active {
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            color: white;
            box-shadow: 0 2px 8px rgba(46, 82, 61, 0.15);
        }

        .login-form-modern {
            margin-top: 2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
            position: relative;
        }

        .form-label {
            color: var(--primary-green);
            font-weight: 600;
            margin-bottom: 0.5rem;
            display: block;
            transition: all 0.3s ease;
        }

        .form-input {
            width: 100%;
            padding: 1rem 1rem 1rem 3rem;
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid rgba(152, 226, 198, 0.3);
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s ease;
            color: var(--primary-green);
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary-light);
            background: white;
            box-shadow: 0 0 0 4px rgba(76, 175, 80, 0.1);
        }

        .form-group i {
            position: absolute;
            left: 1rem;
            top: 2.7rem;
            color: var(--primary-green);
            opacity: 0.7;
            transition: all 0.3s ease;
        }

        .form-group:focus-within i {
            transform: scale(1.1);
            opacity: 1;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            user-select: none;
        }

        .checkbox-label input[type="checkbox"] {
            appearance: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(152, 226, 198, 0.5);
            border-radius: 6px;
            position: relative;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .checkbox-label input[type="checkbox"]:checked {
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            border-color: transparent;
        }

        .checkbox-label input[type="checkbox"]:checked::before {
            content: '✓';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 12px;
        }

        .btn-primary {
            width: 100%;
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            color: white;
            padding: 1rem;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            border: none;
            margin-top: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-primary::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.2),
                transparent
            );
            transition: 0.5s;
        }

        .btn-primary:hover::before {
            left: 100%;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 
                0 4px 12px rgba(46, 82, 61, 0.2),
                0 0 0 2px rgba(255, 255, 255, 0.1);
        }

        .login-footer-modern {
            margin-top: 2rem;
            color: var(--primary-green);
            font-weight: 500;
        }

        .login-footer-modern a {
            color: var(--primary-light);
            text-decoration: none;
            font-weight: 600;
            position: relative;
        }

        .login-footer-modern a::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, var(--gradient-start), var(--gradient-end));
            transform: scaleX(0);
            transform-origin: right;
            transition: transform 0.3s ease;
        }

        .login-footer-modern a:hover::after {
            transform: scaleX(1);
            transform-origin: left;
        }

        @media (max-width: 600px) {
            .login-card-modern {
                padding: 2rem 1.5rem;
                margin: 1rem;
            }
            
            .login-title-modern {
                font-size: 2rem;
            }
        }

        /* Add floating leaf particles */
        .leaf-particle {
            position: fixed;
            pointer-events: none;
            z-index: 0;
            animation: fall-rotate 12s linear infinite;
        }

        @keyframes fall-rotate {
            0% {
                transform: translateY(-100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="eco-particles" id="ecoParticles"></div>
    <div class="login-main">
        <div class="login-card-modern">
            <div class="login-logo-modern">
                <img src="/images/logo.png" alt="ReLeaf Logo" onerror="this.onerror=null; this.src='/static/images/logo.png';">
            </div>
            <div class="login-title-modern">Welcome Back</div>
            <div class="login-subtitle-modern">Sign in to your ReLeaf account</div>
            <div class="login-tabs">
                <div class="login-tab " onclick="switchTab('admin', this)">
                    <span><i class="fas fa-user-shield"></i> Admin Login</span>
                </div>
                <div class="login-tab active" onclick="switchTab('user', this)">
                    <span><i class="fas fa-seedling"></i> User Login</span>
                </div>
            </div>
            
            <form action="/login" method="post" class="login-form-modern">
                <input type="hidden" name="loginType" id="loginType" value="user">
                <div class="form-group">
                    <label for="email" class="form-label"><span id="emailLabel">Email</span></label>
                    <i class="fas fa-envelope"></i>
                    <input type="text" id="email" name="email" class="form-input" 
                           placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" name="password" class="form-input" 
                           placeholder="Enter your password" required>
                    <i class="fas fa-eye password-toggle" id="passwordToggle"></i>
                </div>
                <div class="form-group" style="margin-bottom: 1rem;">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <label class="checkbox-label" style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                            <input type="checkbox" name="remember" style="width: 1rem; height: 1rem;">
                            <span style="color: #4b5563; font-size: 0.9rem;">Remember me</span>
                        </label>
                        <a href="#" style="color: #2d7a48; font-size: 0.9rem; text-decoration: none;">Forgot password?</a>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-seedling" style="margin-right: 0.5rem;"></i>
                    <span>Sign In</span>
                </button>
            </form>
            <div class="login-footer-modern" id="loginFooter">
                
                    <p>Don't have an account? <a href="/register">Register here</a></p>
                
                
            </div>
        </div>
    </div>
    <script>
        // Remove preload class after page load
        window.addEventListener('load', () => {
            document.body.classList.remove('preload');
            // Animate card entrance
            try {
                if (typeof gsap !== 'undefined') {
                    gsap.to('.login-card-modern', {
                        opacity: 1,
                        y: 0,
                        duration: 0.8,
                        ease: 'power3.out'
                    });
                } else {
                    // Fallback if GSAP is not loaded
                    document.querySelector('.login-card-modern').style.opacity = '1';
                    document.querySelector('.login-card-modern').style.transform = 'translateY(0)';
                }
            } catch (error) {
                console.error('Animation error:', error);
                // Ensure the card is visible even if animation fails
                document.querySelector('.login-card-modern').style.opacity = '1';
                document.querySelector('.login-card-modern').style.transform = 'translateY(0)';
            }
        });

        function switchTab(type, element) {
            document.getElementById('loginType').value = type;
            
            // Animate tab switch
            gsap.to('.login-form-modern', {
                opacity: 0,
                y: -20,
                duration: 0.3,
                onComplete: () => {
                    // Update UI elements
                    const tabs = document.querySelectorAll('.login-tab');
                    tabs.forEach(tab => tab.classList.remove('active'));
                    element.classList.add('active');
                    
                    const emailLabel = document.getElementById('emailLabel');
                    const emailInput = document.getElementById('email');
                    const emailIcon = emailInput.previousElementSibling;
                    
                    emailLabel.textContent = type === 'admin' ? 'Username' : 'Email';
                    emailInput.placeholder = type === 'admin' ? 'Enter your username' : 'Enter your email';
                    emailIcon.className = 'fas ' + (type === 'admin' ? 'fa-user' : 'fa-envelope');
                    
                    const footer = document.getElementById('loginFooter');
                    if (type === 'admin') {
                        footer.innerHTML = '<p>Manually provisioned</p>';
                    } else {
                        footer.innerHTML = '<p>Don\'t have an account? <a href="/register">Register here</a></p>';
                    }
                    
                    // Animate form back in
                    gsap.to('.login-form-modern', {
                        opacity: 1,
                        y: 0,
                        duration: 0.3
                    });
                }
            });
        }

        // Password visibility toggle
        const passwordToggle = document.getElementById('passwordToggle');
        const passwordInput = document.getElementById('password');

        passwordToggle.addEventListener('click', function() {
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                this.classList.remove('fa-eye');
                this.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                this.classList.remove('fa-eye-slash');
                this.classList.add('fa-eye');
            }
        });

        // Input focus animations
        document.querySelectorAll('.form-input').forEach(input => {
            input.addEventListener('focus', function() {
                this.parentElement.classList.add('focused');
                gsap.to(this.previousElementSibling, {
                    opacity: 1,
                    scale: 1.1,
                    duration: 0.3
                });
            });

            input.addEventListener('blur', function() {
                if (!this.value) {
                    this.parentElement.classList.remove('focused');
                }
                gsap.to(this.previousElementSibling, {
                    opacity: 0.7,
                    scale: 1,
                    duration: 0.3
                });
            });
        });

        // Button hover animation
        document.querySelector('.btn-primary').addEventListener('mouseover', function() {
            gsap.to(this, {
                scale: 1.02,
                duration: 0.3
            });
        });

        document.querySelector('.btn-primary').addEventListener('mouseout', function() {
            gsap.to(this, {
                scale: 1,
                duration: 0.3
            });
        });

        // Create floating leaf particles
        function createLeafParticle() {
            const leaf = document.createElement('div');
            leaf.className = 'leaf-particle';
            
            // Random leaf type
            const leafTypes = ['🌿', '🍃', '🌱', '☘️'];
            leaf.innerHTML = leafTypes[Math.floor(Math.random() * leafTypes.length)];
            
            // Random position and size
            const startX = Math.random() * window.innerWidth;
            const size = Math.random() * 20 + 10;
            
            leaf.style.cssText = `
                left: px;
                font-size: px;
                animation-delay: 0.7125487435016636s;
                animation-duration: 18.223166069133136s;
            `;
            
            document.getElementById('ecoParticles').appendChild(leaf);
            
            // Remove leaf after animation
            leaf.addEventListener('animationend', () => leaf.remove());
        }

        // Create initial particles
        for (let i = 0; i < 10; i++) {
            createLeafParticle();
        }

        // Continue creating particles
        setInterval(createLeafParticle, 3000);

        // Create subtle light rays effect
        function createLightRay() {
            const ray = document.createElement('div');
            ray.className = 'light-ray';
            ray.style.cssText = `
                position: fixed;
                width: 2px;
                height: 226.47514742179737px;
                background: linear-gradient(to bottom, rgba(255,255,255,0.2), transparent);
                transform: rotate(238.91335174742397deg);
                left: 96.35261868059321vw;
                top: 54.666568522684265vh;
                opacity: 0;
                pointer-events: none;
            `;
            
            document.body.appendChild(ray);
            
            gsap.to(ray, {
                opacity: 0.5,
                duration: Math.random() * 2 + 1,
                yoyo: true,
                repeat: 1,
                onComplete: () => ray.remove()
            });
        }

        // Create light rays periodically
        setInterval(createLightRay, 2000);
    </script>
</body>
</html>
