services:
  - type: web
    name: releaf
    runtime: java
    buildCommand: ./gradlew clean build -x test
    startCommand: java -Dserver.port=$PORT -Dspring.profiles.active=prod -jar build/libs/*.jar
    envVars:
      - key: JAVA_VERSION
        value: 21
      - key: SPRING_PROFILES_ACTIVE
        value: prod
    healthCheckPath: /actuator/health

databases:
  - name: releaf-db
    databaseName: releaf
    user: releaf
